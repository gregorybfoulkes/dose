services:
  site:
    image: dose-site:local
    build:
      context: .
      pull: true
    ports:
      - "127.0.0.1:${DOSE_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 10s
