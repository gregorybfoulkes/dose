{% extends "base.html" %}

{% block content %}
    <main id="main-content">
        <h1 class="section-title">Tags</h1>
        <ul class="post-list">
            {% for term in terms %}
            <li>
                <a class="post-link" href="{{ term.permalink }}">
                    <span class="post-marker" aria-hidden="true"></span>
                    <span class="post-title">{{ term.name }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </main>
{% endblock content %}
